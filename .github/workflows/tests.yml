# The test gate — the only one. There is no pre-push hook; everything that
# guards this repo runs here.
#
# Runs on pushes to our own long-lived branches and on manual dispatch — NOT on
# `pull_request`, so a fork's PR cannot spend runner minutes on its own.
name: Tests

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch. A push that supersedes an in-flight run cancels it —
  # the older commit's result is not interesting once a newer one exists.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync --extra dev

      # Without these the runner would silently test less than it claims to.
      # Measured, not guessed — `-rs` on the first green run named every skip:
      #   53 "no LaTeX engine installed", and before that "Chromium unavailable"
      #   plus a multilingual PDF test failing for want of CJK glyphs.
      # All of them pass on a developer machine, which has the lot.
      #
      # texlive-xetex + latexmk rather than tectonic: tectonic downloads its
      # packages at run time, and a test suite that reaches the network to pass
      # is a flake waiting to happen. The template preamble needs fontawesome5,
      # supertabular, titlesec, enumitem, multirow and tabularx, which live in
      # latex-extra / fonts-extra.
      - name: Install the renderers the tests assume
        working-directory: apps/backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            latexmk \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra
          uv run playwright install --with-deps chromium

      - name: pytest
        working-directory: apps/backend
        # The LLM-as-judge evals are excluded by the project's own addopts
        # (-m "not eval"), so this makes no network or LLM calls.
        # `-rs` prints the reason for every skip. A suite that quietly skips a
        # chunk of itself on the runner reads green while testing less than the
        # developer's machine does, so the reasons have to be in the log.
        run: uv run pytest -q -p no:cacheprovider -rs

  frontend:
    name: Frontend (vitest + tsc + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: vitest
        working-directory: apps/frontend
        run: npm run test

      # tsconfig includes tests/, which `next build` never typechecks, so this is
      # the only thing that catches a broken test fixture.
      - name: tsc --noEmit
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: eslint
        working-directory: apps/frontend
        run: npm run lint
