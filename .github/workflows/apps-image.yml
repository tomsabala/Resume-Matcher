# Builds the image that apps.tom-sabala.dev runs.
#
# Separate from docker-publish.yml on purpose. That workflow builds the origin-owning image
# (no basePath, two architectures, upstream's namespace) and is a merge-conflict magnet every
# time we pull from srbhr. This one owns a single deployment detail — the mount prefix, which
# Next.js inlines at build time — and never needs to be reconciled with upstream.
name: Publish apps-mount image

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/apps-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: apps-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/resume-matcher
  # Must match the slug in the gateway's frontend/src/apps/apps.json. It is baked into the
  # build: change it here and the app 404s behind the gateway.
  BASE_PATH: /a/resume-matcher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # amd64 only: the gateway VPS is x86. Adding arm64 here means QEMU emulating a
          # Playwright + Tectonic build, which triples the runtime for nothing.
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_BASE_PATH=${{ env.BASE_PATH }}
          tags: |
            ${{ env.IMAGE }}:apps-mount
            ${{ env.IMAGE }}:apps-mount-${{ github.sha }}
          # Registry cache, not type=gha: this image is ~1.9 GB and mode=max would keep
          # evicting itself against GitHub's 10 GB per-repo cache limit.
          cache-from: type=registry,ref=${{ env.IMAGE }}:apps-mount-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:apps-mount-buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '`${{ env.IMAGE }}:apps-mount` (moving) and `:apps-mount-${{ github.sha }}` (immutable)'
            echo ""
            echo "On the gateway VPS: \`docker pull ${{ env.IMAGE }}:apps-mount\`."
            echo "Running instances are recreated on their next request — the broker compares"
            echo "the container's image digest against the tag's current one."
          } >> "$GITHUB_STEP_SUMMARY"
