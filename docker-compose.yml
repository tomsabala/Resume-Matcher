services:
  resume-matcher:
    image: ghcr.io/srbhr/resume-matcher
    build:
      context: .
      args:
        # Ships Tectonic (~30MB + a warmed TeX bundle) so LaTeX export can
        # compile in-container. Set false for a smaller image: generation,
        # source editing and the .tex download still work, only PDF
        # compilation is unavailable.
        INSTALL_LATEX: ${INSTALL_LATEX:-true}
    container_name: resume-matcher
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - resume-data:/app/backend/data
    #secrets:
    #  - llm_api_key
    environment:
      # Tenancy. `single` = a private instance: no authentication, every
      # caller is the admin of one shared dataset. Correct on your own
      # machine, WRONG the moment the port is reachable by anyone else.
      # A shared deployment must set `header` AND `GATEWAY_SECRET`, and must
      # sit behind a gateway that authenticates visitors and injects
      # X-Apps-Tenant / X-Apps-Role / X-Apps-Proxy-Secret. The backend refuses
      # to start if the mode is blank or misspelled, and refuses `header`
      # without a secret.
      - TENANT_MODE=${TENANT_MODE:-single}
      # Shared secret the gateway presents; required by TENANT_MODE=header.
      - GATEWAY_SECRET=${GATEWAY_SECRET:-}
      # One-shot: adopt the workspaces a single-mode instance already holds.
      # Set to the operator's X-Apps-Tenant value, start once, then remove.
      #- CLAIM_TENANT_REF=${CLAIM_TENANT_REF:-}
      # domain in reverse proxy
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      # Logging configuration: DEBUG, INFO, WARNING, ERROR
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      #- LOG_LEVEL_FILE=${LOG_LEVEL_FILE:-}
      # Debug level for LiteLLM: DEBUG, INFO, WARNING, ERROR
      - LOG_LLM=${LOG_LLM:-WARNING}
      #- LOG_LLM_FILE=${LOG_LLM_FILE:-}
      # LLM Configuration - configure via Settings UI or set env vars for explicit overrides
      # Supported providers: openai, anthropic, openrouter, gemini, deepseek, ollama
      # Defaults are defined in apps/backend/app/config.py
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-}
      # Optional Docker Secret file path (same behavior as Postgres-style *_FILE)
      #- LLM_API_KEY_FILE=${LLM_API_KEY_FILE:-/run/secrets/llm_api_key}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # For Ollama running on host machine, use host.docker.internal:
      # - LLM_API_BASE=http://host.docker.internal:11434
      - LLM_API_BASE=${LLM_API_BASE:-}
      # CORS origins (JSON array format). FRONTEND_BASE_URL is auto-included.
      #- CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      # Pin the LaTeX engine instead of auto-detecting
      # (tectonic > latexmk > xelatex > pdflatex).
      #- RESUME_MATCHER_LATEX_ENGINE=tectonic
    restart: unless-stopped

#secrets:
#  llm_api_key:
#    file: ./secrets/llm_api_key

volumes:
  resume-data:
    driver: local
